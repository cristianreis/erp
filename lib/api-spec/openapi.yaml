components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # ── Dashboard ──────────────────────────────────────────────
    DashboardStats:
      type: object
      properties:
        openSalesOrders:
          type: integer
        lowStockCount:
          type: integer
        delayedProductionOrders:
          type: integer
        pendingPurchaseRequests:
          type: integer
        availableFinishedGoods:
          type: integer
        inMachiningCount:
          type: integer
        pendingAssemblies:
          type: integer
        openPurchaseOrders:
          type: integer
        salesOrdersByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        productionOrdersByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        stockByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryStock"
      required:
        - openSalesOrders
        - lowStockCount
        - delayedProductionOrders
        - pendingPurchaseRequests
        - availableFinishedGoods
        - inMachiningCount
        - pendingAssemblies
        - openPurchaseOrders
        - salesOrdersByStatus
        - productionOrdersByStatus
        - stockByCategory

    StatusCount:
      type: object
      properties:
        status:
          type: string
        count:
          type: integer
      required: [status, count]

    CategoryStock:
      type: object
      properties:
        category:
          type: string
        totalQuantity:
          type: number
        productCount:
          type: integer
      required: [category, totalQuantity, productCount]

    LowStockItem:
      type: object
      properties:
        id:
          type: string
        productCode:
          type: string
        productName:
          type: string
        currentQuantity:
          type: number
        reservedQuantity:
          type: number
        availableQuantity:
          type: number
        minimumStock:
          type: number
        suggestedAction:
          type: string
      required:
        - id
        - productCode
        - productName
        - currentQuantity
        - reservedQuantity
        - availableQuantity
        - minimumStock
        - suggestedAction

    # ── Product ────────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        categoryId:
          type: ["string", "null"]
        categoryName:
          type: ["string", "null"]
        itemType:
          type: string
        unit:
          type: string
        minimumStock:
          type: number
        maximumStock:
          type: ["number", "null"]
        safetyStock:
          type: ["number", "null"]
        leadTimeDays:
          type: ["integer", "null"]
        salePrice:
          type: ["number", "null"]
        costPrice:
          type: ["number", "null"]
        isSellable:
          type: boolean
        isManufactured:
          type: boolean
        isPurchased:
          type: boolean
        requiresMachining:
          type: boolean
        requiresAssembly:
          type: boolean
        active:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - code
        - name
        - itemType
        - unit
        - minimumStock
        - isSellable
        - isManufactured
        - isPurchased
        - requiresMachining
        - requiresAssembly
        - active
        - createdAt

    CreateProductBody:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        categoryId:
          type: ["string", "null"]
        itemType:
          type: string
        unit:
          type: string
        minimumStock:
          type: number
        maximumStock:
          type: ["number", "null"]
        safetyStock:
          type: ["number", "null"]
        leadTimeDays:
          type: ["integer", "null"]
        salePrice:
          type: ["number", "null"]
        costPrice:
          type: ["number", "null"]
        isSellable:
          type: boolean
        isManufactured:
          type: boolean
        isPurchased:
          type: boolean
        requiresMachining:
          type: boolean
        requiresAssembly:
          type: boolean
      required:
        - code
        - name
        - itemType
        - unit
        - minimumStock
        - isSellable
        - isManufactured
        - isPurchased
        - requiresMachining
        - requiresAssembly

    UpdateProductBody:
      type: object
      properties:
        code:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        categoryId:
          type: ["string", "null"]
        itemType:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        minimumStock:
          type: ["number", "null"]
        maximumStock:
          type: ["number", "null"]
        safetyStock:
          type: ["number", "null"]
        leadTimeDays:
          type: ["integer", "null"]
        salePrice:
          type: ["number", "null"]
        costPrice:
          type: ["number", "null"]
        isSellable:
          type: ["boolean", "null"]
        isManufactured:
          type: ["boolean", "null"]
        isPurchased:
          type: ["boolean", "null"]
        requiresMachining:
          type: ["boolean", "null"]
        requiresAssembly:
          type: ["boolean", "null"]
        active:
          type: ["boolean", "null"]

