      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockMovementBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"

  /stock/reservations:
    get:
      operationId: listStockReservations
      tags: [stock]
      summary: List stock reservations
      parameters:
        - name: sales_order_id
          in: query
          schema:
            type: ["string", "null"]
        - name: product_id
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockReservation"

  /stock/availability/{productId}:
    get:
      operationId: getStockAvailability
      tags: [stock]
      summary: Get stock availability for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
