      operationId: listStockBalances
      tags: [stock]
      summary: List stock balances
      parameters:
        - name: product_id
          in: query
          schema:
            type: ["string", "null"]
        - name: warehouse_id
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: low_stock_only
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: Stock balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockBalance"

  /stock/movements:
    get:
      operationId: listStockMovements
      tags: [stock]
      summary: List stock movements
      parameters:
        - name: product_id
          in: query
