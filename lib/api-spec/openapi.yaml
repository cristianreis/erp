            type: ["string", "null"]
        - name: warehouse_id
          in: query
          schema:
            type: ["string", "null"]
        - name: movement_type
          in: query
          schema:
            type: ["string", "null"]
        - name: from_date
          in: query
          schema:
            type: ["string", "null"]
        - name: to_date
          in: query
          schema:
            type: ["string", "null"]
