services:
  - type: web
    name: asset-manager
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @workspace/erp run build && pnpm --filter @workspace/api-server run build
    preDeployCommand: pnpm --filter @workspace/db run push-force
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: asset-manager-db
          property: connectionString

databases:
  - name: asset-manager-db
    plan: free
